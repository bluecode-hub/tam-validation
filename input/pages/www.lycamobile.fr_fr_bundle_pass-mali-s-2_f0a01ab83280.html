tured_data_markup":[null],"field_template_type":["pdp"],"field_workflow":["static_page"],"field_workflow_access":["content_ops_team","administrator","seo_team"],"field_workflow_status":["published"]}},"pdpSeoData":{"id":"2814","productName":"Pass Mali S","productDisplayName":"Pass Mali S","allowPurchase":"Yes","promoOfferLine1":null,"promoOfferLine2":null,"promoOfferLine3":null,"promoOfferLine4":null,"shortDescription":"\u003cul class=\"plan-details-list\"\u003e\u003cli\u003e140 minutes vers Malitel, Orange Mali et Senegal Orange\u003c/li\u003e\u003cli class=\"plan-details-listitem\"\u003eRoaming EU\u003cbr /\u003e\u003c/li\u003e\u003c/ul\u003e","longDescription":"\u003cul class=\"plan-details-list\"\u003e\u003cli\u003e140 minutes vers Malitel, Orange Mali et Senegal Orange\u003c/li\u003e\u003cli class=\"plan-details-listitem\"\u003eRoaming EU\u003c/li\u003e\u003cli class=\"plan-details-listitem\"\u003eeSIM disponible\u003cbr /\u003e\u003c/li\u003e\u003c/ul\u003e","productTermsAndCondition":"\u003cp\u003eLe Pass Mali S comprend 140 minutes vers Malitel, Orange Mali et Senegal Orange.En cas d\u0026#039;achat avec le forfait national, le client bénéficiera toujours de 140 minutes.\u003c/p\u003e\u003cp\u003ePour tout renouvellement ou rachat, le client recevra 140 minutes vers Malitel, Orange Mali et Senegal Orange.\u003c/p\u003e\u003cp\u003eLe Pass Mali S est valable pendant 30 jours.\u003c/p\u003e\u003cp\u003eVeuillez noter que la disponibilité de la 5G dépend du modèle de téléphone et de la localisation. \u003c/p\u003e\u003cp\u003eL\u0026#039;offre et les conditions sont sujettes à modification. Pour consulter les conditions générales, veuillez visiter \u003cbr /\u003e\u003ca href=\"/termscondition\"\u003elycamobile.fr/fr/termscondition/\u003c/a\u003e\u003c/p\u003e\u003cp\u003eUne fois que le client a utilisé la quantité de données accordée dans l\u0026#039;UE, il sera facturé 0,00189 €/Mo.\u003c/p\u003e\u003cp\u003eL\u0026#039;offre est applicable à partir du  14-07-2025.\u003c/p\u003e\u003cp\u003e\u003cbr /\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBuy this plan with your topup credit by texting 551 to 3535 :  T\u0026amp;C Applied\u003c/strong\u003e\u003c/p\u003e","contractVisibility":null,"contractText":null,"familyPlanAvailable":null,"familyPlanImage":null,"captchaFlag":true,"esimAvailableImage":null,"euRoamingImage":null,"featuresDataSharingImage":null,"wifiCallingImage":null,"disneyHotstarImage":null,"faq":[{"question":"\u003cp\u003eQu\u0026#039;est-ce qu\u0026#039;une offre carte SIM seule ?\u003c/p\u003e","answer":"\u003cp\u003eLorsque vous achetez une offre carte SIM seule, vous obtenez uniquement une carte SIM avec la recharge ou le forfait de votre choix. La carte SIM n’est pas vendue avec un mobile. Une carte SIM seule reste toujours une offre prépayée car vous aurez besoin d’acheter ensuite une recharge pour utiliser la plupart des services tels que les appels, les SMS, la data, l\u0026#039;itinérance (le cas échéant) et bien d\u0026#039;autres. Chez Lyca Mobile, nous proposons deux types d’offre : les recharges et les forfaits.\u003c/p\u003e"},{"question":"\u003cp\u003eQu\u0026#039;est-ce qu\u0026#039;une carte SIM prépayée?\u003c/p\u003e","answer":"\u003cp\u003eLorsque vous optez pour une carte SIM prépayée, vous payez pour l\u0026#039;utilisation initiale de ses services. Toutes nos cartes SIM prépayées sont livrées sans contrat ni engagement. Il n\u0026#039;y a pas de recharges / Pass joint afin que vous puissiez choisir l’offre que vous voulez. Vous pouvez toujours modifier ou ajouter de nouvelles offres à votre compte avec une carte SIM prépayée Lyca Mobile.\u003c/p\u003e"},{"question":"\u003cp\u003eComment activer une carte SIM gratuite ?\u003c/p\u003e","answer":"\u003cp\u003eL\u0026#039;activation d\u0026#039;une carte SIM gratuite est simple. Une fois que vous avez reçu votre carte SIM Lyca Mobile, insérez-la dans votre téléphone mobile. Attendez quelques instants, la connexion s\u0026#039;établira automatiquement. Composez *132# pour vérifier votre numéro mobile. Après cela, choisissez et achetez le meilleur forfait sur LycaMobile.fr et votre forfait sera crédité sur votre compte. N\u0026#039;oubliez pas de vous enregistrer.\u003c/p\u003e"},{"question":"\u003cp\u003eQu\u0026#039;est-ce que l’offre mobile data / internet ?\u003c/p\u003e","answer":"\u003cp\u003eLes offres mobiles data / internet sont des offres à haut débit. La plupart de nos Pass nationaux et internationaux sont équipés d\u0026#039;Internet mobile. Cependant, selon votre utilisation, vous pouvez acheter des recharges spécifiques data / internet supplémentaires pour surfer sur le Web, télécharger des films et bien plus encore. Nos offres spécifiques data / internet mobiles n\u0026#039;incluent ni voix ni SMS. Visitez nos pages consacrées aux Pass data pour explorer nos offres actuelles.\u003c/p\u003e"},{"question":"\u003cp\u003eComment ajouter des données à mon forfait SIM ?\u003c/p\u003e","answer":"\u003cp\u003ePour ajouter plus de données à votre forfait SIM de Lyca Mobile, vous pouvez généralement recharger votre compte avec du crédit supplémentaire, puis utiliser ce crédit pour acheter un supplément de données. Vous pouvez le faire via le site web de Lyca Mobile, l\u0026#039;application mobile ou en composant un code spécifique fourni par le réseau. Il est préférable de consulter les canaux officiels de Lyca Mobile ou de contacter son service clientèle pour connaître la procédure spécifique et les options disponibles.\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.lycamobile.fr/fr/\"\u003eLyca Mobile\u003c/a\u003e propose des options conviviales pour ce faire, telles que l\u0026#039;accès à son site web, son application mobile ou la composition de codes spécifiques. Grâce à ces canaux, vous pouvez explorer les différentes options d\u0026#039;ajout de données et sélectionner celle qui correspond le mieux à vos besoins en matière de données. Pour obtenir des instructions détaillées et connaître les options disponibles, il est recommandé de visiter le \u003ca href=\"https://www.lycamobile.fr/fr/\"\u003eLycaMobile.fr\u003c/a\u003e ou de contacter leur service clientèle pour une assistance personnalisée.\u003c/p\u003e"},{"question":"\u003cp\u003ePuis-je acheter plus d\u0026#039;un forfait à la fois ?\u003c/p\u003e","answer":"\u003cp\u003eDans la plupart des cas, vous ne pouvez pas acheter plusieurs forfaits en même temps avec Lyca Mobile. En général, les forfaits sont achetés individuellement et chaque forfait a sa propre période de validité et ses propres limites d\u0026#039;utilisation. Il est conseillé de vérifier auprès de Lyca Mobile leur politique spécifique concernant l\u0026#039;achat simultané de plusieurs forfaits.\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003eLyca Mobile propose une gamme d\u0026#039;options de forfaits qui répondent à différents besoins et modèles d\u0026#039;utilisation. Vous pouvez explorer les forfaits disponibles et sélectionner celui qui répond le mieux à vos besoins.\u003c/p\u003e"},{"question":"\u003cp\u003eTous les forfaits incluent-ils le Mobile hotspot ?\u003c/p\u003e","answer":"\u003cp\u003eTous les forfaits Lyca Mobile n\u0026#039;incluent pas la fonctionnalité Mobile hotspot. L\u0026#039;inclusion d\u0026#039;un hotspot mobile dépend de l\u0026#039;offre spécifique que vous choisissez. Il est recommandé de consulter les détails de l\u0026#039;abonnement ou de contacter Lyca Mobile pour vérifier si le hotspot mobile est inclus ou s\u0026#039;il y a des frais supplémentaires pour l\u0026#039;utiliser.\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003eLyca Mobile propose toutefois des forfaits qui incluent spécifiquement l\u0026#039;utilisation du hotspot mobile, ce qui vous permet de partager votre connexion de données avec d\u0026#039;autres appareils. Si vous avez besoin de la fonctionnalité hotspot mobile, il est conseillé de vérifier les options de l\u0026#039;abonnement de Lyca Mobile ou de contacter notre \u003ca href=\"/help/contact-us/\"\u003eService Client\u003c/a\u003e pour trouver un abonnement qui inclut cette fonctionnalité.\u003c/p\u003e"},{"question":"\u003cp\u003ePuis-je transférer mon numéro de mon réseau actuel vers une carte SIM Lyca Mobile ?\u003c/p\u003e","answer":"\u003cp\u003eOui, vous pouvez \u003ca href=\"/keep-phone-number/\"\u003etransférer votre numéro de téléphone\u003c/a\u003e mobile de votre réseau actuel vers une carte SIM Lyca Mobile. Ce processus est appelé portage ou transfert de numéro. Pour initier le transfert, vous devez suivre les instructions de portage fournies par Lyca Mobile et fournir les informations nécessaires. Il est important de noter qu\u0026#039;il peut y avoir des exigences spécifiques et des critères d\u0026#039;éligibilité pour le portage de numéro, il est donc conseillé de contacter Lyca Mobile pour obtenir des instructions détaillées et de l\u0026#039;aide.\u003c/p\u003e"},{"question":"\u003cp\u003eQuand puis-je modifier la durée de mon forfait ?\u003c/p\u003e","answer":"\u003cp\u003eLa possibilité de modifier la durée de votre forfait dépend des conditions et options spécifiques proposées par Lyca Mobile. Il est recommandé de consulter les plans et politiques de Lyca Mobile ou de contacter son service clientèle pour savoir si et quand vous pouvez modifier la durée de votre forfait et si des frais ou des conditions s\u0026#039;appliquent. Veuillez vous référer aux conditions générales de chaque forfait.\u003c/p\u003e"},{"question":"\u003cp\u003eLyca Mobile propose-t-il un forfait data only ?\u003c/p\u003e","answer":"\u003cp\u003eOui, Lyca Mobile propose des forfaits data only dans certaines régions. Ces forfaits sont spécifiquement conçus pour les utilisateurs qui ont principalement besoin de données pour accéder à Internet et peuvent ne pas inclure de minutes ou de textes groupés. Il est conseillé de consulter le site web de Lyca Mobile ou de contacter son service clientèle pour s\u0026#039;assurer de la disponibilité et des détails des forfaits de données uniquement dans votre région.\u003c/p\u003e"},{"question":"\u003cp\u003eLes forfaits SIM ont-ils une date d\u0026#039;expiration ?\u003c/p\u003e","answer":"\u003cp\u003eLes forfaits SIM peuvent avoir une date d\u0026#039;expiration en fonction des conditions spécifiques définies par Lyca Mobile. La période de validité d\u0026#039;un forfait SIM peut varier, et il est important de consulter les détails du forfait ou de contacter Lyca Mobile pour comprendre la date d\u0026#039;expiration spécifique associée au forfait que vous avez choisi. La plupart des forfaits Lyca Mobile ont une durée de validité de 30 jours, sauf si vous prévoyez d\u0026#039;opter pour plusieurs mois à la fois.\u003c/p\u003e"},{"question":"\u003cp\u003eQue comprennent les forfaits Lyca Mobile ? (Données, appels, SMS, etc.)\u003c/p\u003e","answer":"\u003cp\u003eLes abonnements Lyca Mobile comprennent différentes combinaisons de données, d\u0026#039;appels, de SMS et d\u0026#039;autres services. Les services spécifiques varient en fonction de l\u0026#039;offre choisie. Il est recommandé de consulter les détails de chaque forfait sur le site web de Lyca Mobile ou de contacter leur service clientèle pour comprendre les allocations et les fonctions spécifiques incluses dans les plans.\u003c/p\u003e"},{"question":"\u003cp\u003ePuis-je acheter des données supplémentaires ou des options complémentaires pour mon forfait ?\u003c/p\u003e","answer":"\u003cp\u003eOui, vous pouvez généralement acheter des données supplémentaires ou des options complémentaires pour votre forfait Lyca Mobile. Ces options vous permettent d\u0026#039;augmenter votre quota de données ou d\u0026#039;ajouter des services supplémentaires, tels que des minutes d\u0026#039;appel international ou des packs de données en itinérance, en fonction de vos besoins spécifiques. Vous pouvez généralement le faire via le site web de Lyca Mobile, l\u0026#039;application \u003ca href=\"https://play.google.com/store/apps/details?id\u0026#61;com.lycadigital.lmnextgen_france\"\u003eAndroid\u003c/a\u003e ou \u003ca href=\"https://apps.apple.com/fr/app/lycamobile/id1234252942\"\u003eiOS,\u003c/a\u003e ou en composant des codes spécifiques fournis par le réseau. Il est conseillé de consulter les canaux officiels de Lyca Mobile ou de contacter son service clientèle pour connaître les options disponibles et les instructions.\u003c/p\u003e"}],"termsAndCondition":[{"title":"Pass Mali S","description":"\u003cp\u003eTout Inclus Termes et conditions\u003c/p\u003e\u003cp\u003eOffre et tarifs valables jusqu’au 30-09-2024 pour l’achat d’un Pass international 4h \u0026#43; 500 Mo donnant droit à 4h d’appel en France et vers 39 destinations internationales et 500Mo de téléchargement internet, sans aucun coût de connexion. Toutes données téléchargées au-delà du crédit inclus dans le Pass international 4h \u0026#43; 500 Mo acheté seront facturées au tarif standard en vigueur. La durée de validité du Pass international 4h \u0026#43; 500 Mo est de 30 jours à partir de sa date d’activation. Au-delà, le crédit du Pass international 4h \u0026#43; 500 Mo non utilisé ne pourra être reporté. Lorsque le crédit du Pass international 4h \u0026#43; 500 Mo est épuisé, ou à son expiration, le tarif standard en vigueur s’applique. L’activation du Pass international 4h \u0026#43; 500 Mo s’effectue à partir du crédit disponible sur le compte Lyca Mobile et est par conséquent soumise au rechargement. A expiration, un message vous sera envoyé vous proposant de renouveler ou non votre Pass international 4h \u0026#43; 500 Mo. Applicable aux seuls détenteurs d’un numéro français Lyca Mobile, dans la limite d’un Pass international 4h \u0026#43; 500 Mo par carte SIM et par période de 30 jours. Les SMS sont soumis à une politique d’utilisation équitable de 100 SMS par jour. Par la suite, les taux de paiement standards s’appliquent.\u003c/p\u003e\u003cul\u003e\u003cul\u00
